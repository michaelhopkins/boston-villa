name: Refresh league data

on:
  schedule:
    # Hourly. GitHub runs scheduled jobs on a best-effort basis and can delay
    # them under load, which is fine here — referees report scores over days.
    - cron: "17 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Only the ability to push data.json back; nothing else.
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # v4 targets Node 20, which GitHub is retiring; v5 onwards runs on Node 24.
      - uses: actions/checkout@v5

      - name: Fetch fixtures and standings
        run: python3 scripts/fetch_data.py

      - name: Commit if the football changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh league data"
          git push
